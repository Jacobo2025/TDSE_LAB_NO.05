<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Web Site</title>
</head>
<body>
  <h1>My Web Siteeee</h1>
  <p>Hello from my Java HTTP server!</p>
  <img src="images/ballet.jpg" alt="logo" width="80">

  <section>
    <h2>Greeting service</h2>
    <form id="greeting-form">
      <input type="text" id="name-input" placeholder="Your name">
      <button type="submit">Say hello</button>
    </form>
    <p id="greeting-result"></p>
  </section>

  <section>
    <h2>Square service</h2>
    <form id="square-form">
      <input type="number" id="number-input" placeholder="A number">
      <button type="submit">Square it</button>
    </form>
    <p id="square-result"></p>
  </section>

  <section>
    <h2>Server time</h2>
    <button id="time-button">Get server time</button>
    <p id="time-result"></p>
  </section>

  <p id="error-area" style="color:red;"></p>

  <script src="/app.js"></script>
</body>
</html>
